<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 JavaScript</title>
</head>

<body>

    <h1>Menghitung Luas Bangun Datar</h1>

    <script>
        // Fungsi untuk menghitung luas persegi panjang
        // Rumus: panjang × lebar
        function luasPersegiPanjang(panjang, lebar) {
            return panjang * lebar;
        }

        // Fungsi untuk menghitung luas bujur sangkar
        // Rumus: sisi × sisi
        function luasBujurSangkar(sisi) {
            return sisi * sisi;
        }

        // Fungsi untuk menghitung luas segitiga
        // Rumus: 1/2 × alas × tinggi
        function luasSegitiga(alas, tinggi) {
            return 0.5 * alas * tinggi;
        }

        // Nilai yang digunakan
        let panjang = 10;
        let lebar = 5;
        let sisi = 8;
        let alas = 12;
        let tinggi = 6;

        // Menghitung luas masing-masing bangun
        let luasPP = luasPersegiPanjang(panjang, lebar);
        let luasBS = luasBujurSangkar(sisi);
        let luasS = luasSegitiga(alas, tinggi);

        // Menampilkan hasil
        document.write("<h2>Persegi Panjang</h2>");
        document.write("Panjang = " + panjang + "<br>");
        document.write("Lebar = " + lebar + "<br>");
        document.write("Luas = " + luasPP + "<br>");

        document.write("<h2>Bujur Sangkar</h2>");
        document.write("Sisi = " + sisi + "<br>");
        document.write("Luas = " + luasBS + "<br>");

        document.write("<h2>Segitiga</h2>");
        document.write("Alas = " + alas + "<br>");
        document.write("Tinggi = " + tinggi + "<br>");
        document.write("Luas = " + luasS);
    </script>

</body>
</html>
